name: Build newsletter

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays at 13:00 UTC, after the daily news job
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_newsletter.py
      - name: Commit if changed
        run: |
          git config user.name "qubc-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter/
          git diff --cached --quiet || (git commit -m "Build newsletter" && git push)
